[project]
name = "powerhubx-engine"
version = "0.1.0"
description = "PowerHubX simulation and evaluation engine: deterministic power-architecture comparison for AIDC and microgrid sites."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    # Repo-wide lint/type tools, so `pip install -e "engine[dev]"` is enough
    # for CI (the root pyproject.toml is config-only, not an install target).
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
